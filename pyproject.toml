[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-scout"
version = "1.0.5"
description = "A resilient cross-platform desktop workspace for indexing, downloading, reviewing, reconstructing, and analyzing public Wayback Machine captures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Archive Scout contributors"}]
dependencies = ["truststore>=0.10,<1", "urllib3>=2.2,<3", "httpx>=0.28,<1", "python-dotenv>=1.2,<2", "ahocorasick-rs>=1.0.3,<2", "selectolax>=0.4.8,<1"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
research = ["fastembed>=0.7,<1"]
discord = ["discord.py>=2.7,<3"]

[project.scripts]
archive-scout = "archive_scout.cli:main"
archive-scout-discord = "archive_scout.discord_bot:main"

[project.gui-scripts]
archive-scout-gui = "archive_scout.app:main"

[tool.setuptools.packages.find]
include = ["archive_scout*"]

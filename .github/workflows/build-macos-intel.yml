name: Build macOS Intel App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Intel DMG
        run: bash scripts/build_macos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveScout-macOS-Intel
          path: |
            release/ArchiveScout-macOS-Intel.dmg
            release/ArchiveScout-macOS-Intel.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/ArchiveScout-macOS-Intel.dmg release/ArchiveScout-macOS-Intel.dmg.sha256 --clobber
          else
            gh release create "$TAG" release/ArchiveScout-macOS-Intel.dmg release/ArchiveScout-macOS-Intel.dmg.sha256 --title "Archive Scout $TAG" --generate-notes
          fi

name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} Python ${{ matrix.python-version }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-15-intel
          - macos-15
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt

      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Compile source and benchmark runner
        run: python -m compileall -q archive_scout tests scripts/benchmark_offline.py

      - name: Verify imports and package metadata
        run: >-
          python -c "import importlib.metadata, archive_scout, archive_scout.app, archive_scout.cli, ahocorasick_rs;
          from selectolax.lexbor import LexborHTMLParser;
          assert importlib.metadata.version('archive-scout') == '1.0.7.1';
          print('Archive Scout native accelerator imports and metadata checks passed')"

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run offline benchmark smoke test
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        run: python scripts/benchmark_offline.py --cdx-rows 1000 --result-rows 100 --body-bytes 1024

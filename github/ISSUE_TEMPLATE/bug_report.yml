name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the operation, target pattern, and the last visible activity message.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 12.7.6 Monterey
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Archive Scout version
      placeholder: 1.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error text
      render: text
